name: Deploy

# Every push to main deploys to Fly.io once the FLY_API_TOKEN repo secret exists
# (docs/DEPLOY.md → "Deploy on every push"). Without it the job skips with a notice.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip until Fly is set up
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed. See docs/DEPLOY.md."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.FLY_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
      - name: Typecheck and test before shipping
        if: env.FLY_API_TOKEN != ''
        run: npm ci && npm run typecheck && npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
