# Fly.io config for the hosted platform (docs/DEPLOY.md walks through first-time setup).
#
# One always-on machine with one volume: every club's SQLite file lives on /data, and the
# in-process scheduler sends weekly confirmations, so the machine must never auto-stop.
# Secrets (PLATFORM_URL, APP_SECRET, SMTP_*, …) are set with `fly secrets set`, never here.

app = "comedy-booking"          # change if the name is taken: `fly apps create <name>`
primary_region = "iad"          # Ashburn, VA: close to NYC and one of Fly's cheapest regions

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  # Fly's proxy sits in front: trust one hop of X-Forwarded-For / -Proto.
  TRUST_PROXY = "1"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"
  # Daily volume snapshots, kept two weeks (the app also keeps 14 nightly copies in /data/backups).
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
